    <script>
      // Global error handling for sandboxed iframes & cross-origin script resilience
      window.onerror = function (message, source, lineno, colno, error) {
        if (message === 'Script error.' || message === 'Script error') {
          console.warn('[Global] Suppressed cross-origin Script error from iframe:', { source, lineno, colno });
          return true; // Suppress fatal reporting of cross-origin masked errors
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (event.reason.message === 'Script error.' || String(event.reason).includes('Script error'))) {
          event.preventDefault();
        }
      });
      // Filter harmless Vite HMR websocket reconnection noise in cloud sandboxes
      (function() {
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('failed to connect to websocket') || args[0].includes('[vite] failed to connect'))) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();
    </script>
